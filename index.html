<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAVEL BlOG</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/travel-icon.png" alt="travel blog icon">
    <link rel="stylesheet" href="style.css">
</head>

<body id="blog">
    <header>
        <div class="landing-section">
            <div class="header-section">
                <div class="header-icon">
                    <a href="#blog" target=><img src="assets/icons/travel-icon.png" alt="travel blog icon"></a>
                </div>
                <div class="header-information">
                    <div class="header-text">
                        <a href="#highlight">Highlights</a>
                        <a href="">FAQ</a>
                        <a href="">Contact</a>
                    </div>
                </div>
            </div>
        </div>

    </header>
    <section></section>
    <main id="highlight">
        <div class="highlight-section">
            <div class="highlight-header">
                <img src="assets/icons/rocket.png" alt="rocket-icon">
                <h2>Highlights</h2>
            </div>

            <div class="hightlight-text">
                From the historical culture of Japan to the beautiful beaches and volcanic landscapes
                of Gran Canaria <br> to the calm athmosphere of Denmark. Each destination offers a distinct
                way to explore the world.
            </div>
        </div>
        <div class="slider">
            <section class="slider_a">
                <input type="radio" name="slider" value="one" checked>
                <input type="radio" name="slider" value="two">
                <input type="radio" name="slider" value="three">

                <div class="slider_a_wrapper">
                    <a href=""><img class="element_one" src="assets/images/japan-fuji.jpg" alt=""></a>
                    <a href=""><img class="element_two" src="assets/images/japan-beach.jpg" alt=""></a>
                    <a href=""><img class="element_three" src="assets/images/japan-kyoto.jpg" alt=""></a>
                </div>
            </section>
        </div>

    </main>
    <main></main>
    <main></main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <img src="./assets/icons/copyright.png" alt="Copyright">
                <p>Travel Blog 2026</p>
            </div>
            <div class="footer-center">
                <a href="#">Imprint</a>
                <a href="#">Cookie Preferences</a>
            </div>
            <div class="footer-right">
                <img src="./assets/icons/tiktok.png" alt="TikTok">
                <img src="./assets/icons/youtube.png" alt="Youtube">
                <img src="./assets/icons/facebook.png" alt="Facebook">
                <img src="./assets/icons/instagram.png" alt="Instagram">

            </div>
        </div>
        </div>
    </footer>
</body>

</html>
